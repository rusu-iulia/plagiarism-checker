<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Plagiarism Checker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="container py-5" style="max-width: 720px;">
    <h1 class="mb-2">Plagiarism Checker</h1>
    <p class="text-muted">
        Upload a manuscript and it'll pull random phrases from it, search the web for each one,
        scrape the top results, and tell you how much of your document looks like it already
        exists online.
    </p>

    {% if error %}
        <div class="alert alert-danger">{{ error }}</div>
    {% endif %}

    <form action="{{ url_for('check') }}" method="post" enctype="multipart/form-data" class="card p-4 shadow-sm">
        <label for="document" class="form-label fw-bold">Document to check</label>
        <input class="form-control" type="file" id="document" name="document" accept=".docx,.pdf,.txt" required>
        <div class="form-text mb-3">
            Accepts .docx, .pdf, or .txt.
        </div>
        <button type="submit" class="btn btn-primary">Check for plagiarism</button>
    </form>

</div>
</body>
</html>
